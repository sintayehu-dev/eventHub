name: Ethio Events CI/CD Pipeline

on:
  push:
    branches: [ master ]         
  pull_request:
    branches: [ master ]          
  workflow_dispatch:              
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Release notes (optional)'
        required: false
        default: 'Latest build from master branch'
        type: string

env:
  FLUTTER_VERSION: '3.27.4'      
  JAVA_VERSION: '17'              

permissions:
  contents: write                  
  actions: read                   


jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest         
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4   
 
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'   
        java-version: ${{ env.JAVA_VERSION }} 
        
   
    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "Java Home: $JAVA_HOME"
        java -version
        
   
    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "Android SDK: $ANDROID_HOME"
        
   
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'        
        cache: true              
        
    
    - name: Verify Flutter installation
      run: |
        flutter config --no-analytics
        flutter --version
        flutter doctor -v
        
  
    - name: Get dependencies
      run: flutter pub get       
  
    - name: Generate code
      run: |
        flutter packages pub run build_runner clean
        flutter packages pub run build_runner build --delete-conflicting-outputs

    # Setup signing configuration
    - name: Decode and setup keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/eventhub-key.jks
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=eventhub" >> android/key.properties
        echo "storeFile=../eventhub-key.jks" >> android/key.properties
   
    - name: Build Release APK
      run: |
        echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
        flutter build apk --release

    - name: Build Release AAB (App Bundle)
      run: |
        flutter build appbundle --release
   
    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        # Copy APK
        cp build/app/outputs/flutter-apk/app-release.apk artifacts/ethio-events-release-${{ github.run_number }}.apk
        # Copy AAB
        cp build/app/outputs/bundle/release/app-release.aab artifacts/ethio-events-release-${{ github.run_number }}.aab
        
   
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ethio-events-apk-${{ github.run_number }} 
        path: artifacts/ethio-events-release-${{ github.run_number }}.apk
        retention-days: 30

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: ethio-events-aab-${{ github.run_number }} 
        path: artifacts/ethio-events-release-${{ github.run_number }}.aab
        retention-days: 30
        
  
    - name: Comment on PR with download links
      if: github.event_name == 'pull_request' 
      uses: actions/github-script@v7
      with:
        script: |
          const runNumber = context.runNumber;
          const comment = `🚀 **Build completed successfully!**
          
          📱 **Release builds are ready for testing:**
          - APK: \`ethio-events-release-${runNumber}.apk\` (for direct installation)
          - AAB: \`ethio-events-release-${runNumber}.aab\` (for Play Store)
          - Download from [Actions](${context.payload.repository.html_url}/actions/runs/${context.runId})
          
          ✅ **Build info:**
          - Flutter: ${process.env.FLUTTER_VERSION}
          - Java: ${process.env.JAVA_VERSION}
          - Commit: ${context.sha.substring(0, 7)}
          
          **APK Installation:** Download APK → Enable unknown sources → Install
          **AAB Deployment:** Upload to Google Play Console`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.inputs.create_release == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: ethio-events-apk-${{ github.run_number }}
        path: release-files/

    - name: Download AAB artifact
      uses: actions/download-artifact@v4
      with:
        name: ethio-events-aab-${{ github.run_number }}
        path: release-files/
        
    - name: Prepare release files
      run: |
        echo "Contents of release-files directory:"
        ls -la release-files/
        APK_FILE="release-files/ethio-events-release-${{ github.run_number }}.apk"
        AAB_FILE="release-files/ethio-events-release-${{ github.run_number }}.aab"
        if [ ! -f "$APK_FILE" ]; then
          echo "Error: APK file not found at $APK_FILE"
          exit 1
        fi
        if [ ! -f "$AAB_FILE" ]; then
          echo "Error: AAB file not found at $AAB_FILE"
          exit 1
        fi
        echo "APK file confirmed: $APK_FILE"
        echo "AAB file confirmed: $AAB_FILE"
        
    - name: Get version info
      id: version
      run: |
        if [ ! -f "pubspec.yaml" ]; then
          echo "Error: pubspec.yaml not found"
          exit 1
        fi
        VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
        if [ -z "$VERSION" ]; then
          VERSION="1.0.0+${{ github.run_number }}"
        fi
        APP_VERSION=${VERSION%+*}
        BUILD_NUMBER=${VERSION#*+}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        
    - name: Generate changelog
      id: changelog
      run: |
        if [[ "${{ github.event.inputs.release_notes }}" != "" ]]; then
          CHANGELOG="${{ github.event.inputs.release_notes }}"
        else
          CHANGELOG=$(git log --pretty=format:"- %s" --since="24 hours ago" | head -10)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Latest build from master branch"
          fi
        fi
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
      run: |
        APK_FILE="release-files/ethio-events-release-${{ github.run_number }}.apk"
        AAB_FILE="release-files/ethio-events-release-${{ github.run_number }}.aab"
        
        RELEASE_NOTES="📱 **APK**: \`ethio-events-release-${{ github.run_number }}.apk\` (Direct install)
        📦 **AAB**: \`ethio-events-release-${{ github.run_number }}.aab\` (Play Store)
        
        ${CHANGELOG}"
        
        gh release create "build-${{ github.run_number }}" \
          --title "Ethio Events Build #${{ github.run_number }}" \
          --notes "$RELEASE_NOTES" \
          --prerelease \
          "$APK_FILE" \
          "$AAB_FILE"